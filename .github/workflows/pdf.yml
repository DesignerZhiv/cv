name: Build PDF

on:
  push:
    paths: ['*.docx']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Carlito is metric-compatible with Calibri, so the layout matches Word
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-crosextra-carlito
      - run: soffice --headless --convert-to pdf *.docx
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add *.pdf
          git diff --cached --quiet || { git commit -m "Build PDF" && git push; }
